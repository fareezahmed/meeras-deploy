# Cloudflare Worker (static assets) for the production site, meeras.com.au.
#
# The Worker project "meeras-deploy" is connected to the GitHub repository
# (Workers Builds). On every push to main Cloudflare runs `npm run build`,
# which writes dist/, and then `npx wrangler deploy`, which uploads dist/ as
# the Worker's static assets. worker/index.mjs runs only for the paths in
# run_worker_first (the Google Search Console verification file); everything
# else is served straight from the assets.
# `npm run deploy:prod` does the same from this machine after `wrangler login`.
name = "meeras-deploy"
main = "worker/index.mjs"
compatibility_date = "2026-10-01"

# Production hostnames. With the meeras.com.au zone on the same Cloudflare
# account, `wrangler deploy` creates the DNS records and certificate itself.
# The *.workers.dev URL stays off.
workers_dev = false
routes = [
  { pattern = "meeras.com.au", custom_domain = true },
  { pattern = "www.meeras.com.au", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve dist/404.html (which redirects to the home page) for unknown paths.
not_found_handling = "404-page"
# Only this path runs the Worker script; pages and files are served directly.
run_worker_first = ["/google663a0c67b107aea8.html"]
# dist/_headers is applied by the assets layer.
